name: Build Wemmbu Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up stable Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Run full regression and release-readiness tests
        run: npm run test:all

      - name: Build optimized NSIS setup executable
        run: npm run tauri:build:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Wemmbu-AI-Assistant-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
