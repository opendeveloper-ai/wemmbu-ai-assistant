name: Build Wemmbu Linux installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-linux-installers:
    name: Linux x64 (.deb + AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Run full regression and release-readiness tests
        run: npm run test:all

      - name: Build Linux DEB and AppImage installers
        run: npm run tauri:build:linux

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: Wemmbu-AI-Assistant-Linux-x64-Installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
